# Dependabot keeps Cargo and GitHub Actions dependencies current so security
# fixes show up as PRs rather than slipping past.
#
# Each ecosystem's bumps are grouped into a single monthly PR so they share one
# lockfile change instead of stacking conflicting updates.
#
# A `zip` bump is the one to read rather than merge on green: it sets this
# workspace's minimum supported Rust version, so raising it is a change to what
# this crate promises its consumers. See the comment in Cargo.toml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # `zip` goes in a group of its own so it arrives as its own pull request,
    # on a `dependabot/cargo/review-*` branch. The organisation's sweep merges
    # what is green and skips that branch by name, which is what keeps the
    # paragraph above true now that merging is automatic: a bump meant to be
    # read is held rather than landed while nobody is looking. Dependabot fills
    # the first group a dependency matches, so the catch-all below still takes
    # everything else.
    groups:
      review:
        patterns:
          - "zip"
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    # actions/checkout, actions/upload-artifact, and actions/download-artifact
    # are pinned by cargo-dist's generated release.yml. Bumping them
    # independently breaks the plan job. Pick up newer artifact-action versions
    # by updating cargo-dist itself in dist-workspace.toml.
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
