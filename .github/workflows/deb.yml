name: deb

# Build .deb packages and attach them to an existing GitHub release.
#
# Triggers:
# - `release: published` -- ideally fires automatically after cargo-dist
#   (release.yml) creates the release. CAVEAT: when cargo-dist creates the
#   release using the default GITHUB_TOKEN, GitHub does not fire `release:
#   published` for that creation -- this is a documented GHA safeguard
#   against workflow recursion. So in practice this trigger only fires when
#   the release is created by a non-GITHUB_TOKEN actor (manual UI, PAT, etc).
# - `workflow_dispatch` -- the fallback that actually works after a
#   cargo-dist release. Run it manually with:
#     gh workflow run deb.yml -f tag=v<x.y.z>
#   Or trigger from the GitHub UI under the Actions tab.
#
# Only `slipcase` gets a package. `slpc` is a library and there is nothing to
# install, which is why the build names the package rather than taking the
# workspace default.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build .debs for (e.g., v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # Pinned to a commit, and `stable` is a *branch* rather than a tag —
      # so before this it moved whenever its author pushed. This job holds
      # `contents: write` and its last step puts a .deb in front of anybody who
      # installs from a GitHub release, which makes it the one place in this
      # repository where a third party's change reaches a user's machine.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: install cargo-deb
        run: cargo install cargo-deb --locked
      - name: build .deb
        run: cargo deb -p slipcase
      # The tag goes through the environment rather than into the script text.
      # GitHub substitutes an expression before the shell parses the line, so a
      # tag containing a quote or a backtick would be shell syntax rather than
      # an argument — and a `workflow_dispatch` input is free text.
      # `git check-ref-format` permits all three characters. The actor needs
      # push rights to get here either way, so this is hygiene rather than a
      # hole, but it is the pattern and it costs one line.
      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" target/debian/*.deb
