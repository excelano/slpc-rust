name: ci

# The checks themselves live in excelano/.github, so every Rust repo in the
# fleet runs the same ones and a correction reaches all of them at once. What
# stays here is when to run: that is this repo's business, the policy is the
# fleet's.
#
# This repository calls the library policy rather than the binary one, because
# `slpc` is published and owes its consumers the docs and packaging checks the
# library workflow adds. The workspace holds the CLI as well, and the library
# checks are a superset of the binary ones, so one call covers both.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: excelano/.github/.github/workflows/rust-lib-ci.yml@main

  # Three files are front doors to the same thing, so a few paragraphs are
  # duplicated because the medium requires it. This fails when two copies stop
  # agreeing, which is the only thing that keeps them from becoming paraphrases
  # nobody can diff. Not in the shared workflow: no other repo in the fleet has
  # the problem.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./check-shared-docs.py

  # The fleet's shared workflow runs on `ubuntu-latest` and nothing else. That
  # was right while nothing here behaved differently per platform, and it is not
  # right now: `Destination` reserves a temporary file beside the target, sets
  # permissions on it, and renames it into place, and none of those three mean
  # on Windows what they mean on Unix. `set_permissions` with a mode is close to
  # a no-op there, a rename over a file somebody has open is refused rather than
  # allowed, and `tests/dest.rs` already carries a `#[cfg(unix)]` module whose
  # absent counterpart nobody has ever compiled. Every one of those is a claim
  # this repository makes on two platforms it has never run on.
  #
  # Repository-local rather than a matrix in `rust-ci.yml`, on the same grounds
  # the `docs` job above gives for staying here: no other repository in the
  # fleet has this problem, and raising the shared floor to three runners would
  # spend every Rust repository's minutes on it. When a second one grows
  # platform code, the shared workflow is where this belongs.
  #
  # `fail-fast: false` because the two runners are the measurement. Letting the
  # first failure cancel the other would answer half the question and look like
  # it had answered all of it.
  platforms:
    name: Platforms
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2

      # `--all-features` so the `fs` feature is in: it is what `Destination`
      # lives behind, and it is the whole reason this job exists.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The floor declared in Cargo.toml, built and tested rather than asserted.
  # It is not this code's floor — nothing written here needs more than the
  # edition implies — it is `zip`'s, which means it rises whenever `zip` raises
  # its own and nobody here decides that it should. Cargo does not warn on a
  # rust-version it has quietly outgrown, so the promise needs a job. Raise the
  # number here and in Cargo.toml together; they are one statement written twice.
  msrv:
    uses: excelano/.github/.github/workflows/rust-lib-ci.yml@main
    with:
      toolchain: "1.88"
