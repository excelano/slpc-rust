name: corpus

on:
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: excelano/slipcase
          path: spec

      - name: Generate the cases
        run: python3 spec/conformance/generate.py

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2

      - name: Run the corpus
        run: cargo run --release -p corpus -- spec/conformance
