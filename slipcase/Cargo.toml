[package]
name = "slipcase"
description = "Pack, unpack, inspect, and validate slipcase containers: a ZIP holding a payload file and the TOML metadata that describes it"
homepage = "https://github.com/excelano/slipcase"
readme = "README.md"
keywords = ["slipcase", "container", "metadata", "zip", "cli"]
categories = ["command-line-utilities", "filesystem"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "slipcase"
path = "src/main.rs"

[dependencies]
# Path and version both, declared at the workspace root beside the version
# number it has to match. See the comment there.
slpc.workspace = true
clap = { version = "4.6", features = ["derive"] }
# For spooling standard input, which a ZIP reader cannot take from a pipe. The
# tree it brings is pure Rust: libc and linux-raw-sys are declarations, not a C
# library to compile.
tempfile = "3.27"

[dev-dependencies]
# Sandbox directories for the tests that run the binary.
tempfile = "3.27"

[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
# One line per sentence: cargo-deb re-wraps this, and a source line broken
# mid-sentence comes out broken in `apt show`.
extended-description = """
slipcase attaches metadata to a file without changing it. A .slpc container is a ZIP archive holding one payload file of any type together with a TOML document describing it, so that copying, moving, or sending the payload carries its metadata along.
Four verbs: pack, unpack, info, and validate. The format is specified independently of this tool, and ordinary ZIP utilities can read a container without it."""
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1"
# No `assets` list. cargo-deb finds the binary, README.md, and the licence on
# its own, and an explicit `target/release/slipcase` would be wrong on any box
# whose cargo config moves the target directory — which is every box in this
# fleet, and not CI. A path that is right in one place and silently wrong in the
# other is worse than no path.
license-file = ["../LICENSE", "0"]
