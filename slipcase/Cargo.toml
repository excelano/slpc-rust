[package]
name = "slipcase"
description = "Pack, unpack, repack, inspect, and validate Slipcase containers: a ZIP holding a payload file and the TOML metadata that describes it"
homepage = "https://slipcaseformat.org"
readme = "README.md"

# `testsupport` is a path dev-dependency, and `cargo package` strips a path
# dependency it cannot resolve from the packaged manifest. The test files that
# use it then reference a crate the manifest no longer declares, so
# `cargo test --all-features` inside the packaged tree fails to compile — which
# is what anybody vendoring or auditing this crate runs. Shipped that way in
# 0.3.5 and caught by RELEASING.md step 3 before 0.3.6.
#
# Excluded rather than inlined. The helper marks a file the way a platform's
# downloader marks one, and it is shared precisely because it was written twice
# and the two copies disagreed about the Windows arm within an hour; putting a
# third copy here to satisfy the packager would be undoing that on purpose. The
# test needs the workspace, so it stays in the workspace.
exclude = ["tests/cli.rs"]
keywords = ["slipcase", "container", "metadata", "zip", "cli"]
categories = ["command-line-utilities", "filesystem"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "slipcase"
path = "src/main.rs"

[dependencies]
# Path and version both, declared at the workspace root beside the version
# number it has to match. See the comment there.
# `fs` is the library's file-placement half: writing a container to a path,
# atomically, with the permissions a file there should have. See output.rs.
slpc = { workspace = true, features = ["fs", "provenance"] }
clap = { version = "4.6", features = ["derive"] }
# For spooling standard input, which a ZIP reader cannot take from a pipe. The
# tree it brings is pure Rust: libc and linux-raw-sys are declarations, not a C
# library to compile.
tempfile = "3.27"

[dev-dependencies]
# Marking a file the way a downloader does. One copy for both suites: the two
# they had disagreed about the Windows arm within an hour of being written.
testsupport = { path = "../testsupport" }
# Sandbox directories for the tests that run the binary.
tempfile = "3.27"
# A container declaring a version this build does not implement cannot be
# written by the library, which refuses on purpose, so the test that checks how
# the tool reports one builds it directly.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
# One line per sentence: cargo-deb re-wraps this, and a source line broken
# mid-sentence comes out broken in `apt show`.
extended-description = """
slipcase attaches metadata to a file without changing it. A .slpc container is a ZIP archive holding one payload file of any type together with a TOML document describing it, so that copying, moving, or sending the payload carries its metadata along.
Five verbs: pack, unpack, repack, info, and validate. The format is specified independently of this tool, and ordinary ZIP utilities can read a container without it."""
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1"
# No `assets` list. cargo-deb finds the binary, README.md, and the licence on
# its own, and an explicit `target/release/slipcase` would be wrong on any box
# whose cargo config moves the target directory — which is every box in this
# fleet, and not CI. A path that is right in one place and silently wrong in the
# other is worse than no path.
license-file = ["../LICENSE", "0"]
