[package]
name = "slipcase"
description = "Pack, unpack, inspect, and validate slipcase containers: a ZIP holding a payload file and the TOML metadata that describes it"
homepage = "https://github.com/excelano/slipcase"
readme = "README.md"
keywords = ["slipcase", "container", "metadata", "zip", "cli"]
categories = ["command-line-utilities", "filesystem"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "slipcase"
path = "src/main.rs"

[dependencies]
# Both a path and a version: cargo builds against the sibling in this
# workspace, and crates.io rejects a dependency that carries only a path. The
# two crates release together, so the version here is the workspace's own.
slpc = { path = "../slpc", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
# For spooling standard input, which a ZIP reader cannot take from a pipe. The
# tree it brings is pure Rust: libc and linux-raw-sys are declarations, not a C
# library to compile.
tempfile = "3.27"

[dev-dependencies]
# Sandbox directories for the tests that run the binary.
tempfile = "3.27"
