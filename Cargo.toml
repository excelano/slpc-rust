[workspace]
resolver = "3"
members = ["slpc", "slipcase", "corpus", "fuzz", "testsupport"]

[workspace.package]
version = "0.3.11"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/slpc-rust"
# Measured, not inferred: 1.88 builds and passes the suite. The floor is not
# this code's — edition 2021 would imply 1.56 and nothing written here needs
# more — it is `zip`'s, which declares 1.88, above `toml_edit`'s 1.85 and every
# other crate in the tree. That makes it a number nobody here chose and one
# that rises whenever a dependency raises its own, so the msrv job in ci.yml
# builds at it rather than trusting this line. Raise it here and there together.
rust-version = "1.88"

# The binary's dependency on the library lives here rather than in
# slipcase/Cargo.toml, so that it sits beside the version above and the two
# obviously move together. crates.io rejects a path-only dependency, and a
# version requirement cannot inherit `workspace.package.version`, so this
# number is written twice by necessity — adjacent is the best available.
[workspace.dependencies]
slpc = { path = "slpc", version = "0.3.11" }

# cargo-dist builds release binaries under this profile. Thin LTO rather than
# fat: the link is a fraction of the time and the size difference on a binary
# this small does not pay for the rest.
# Overflow checks stay on in release, and that is for `fuzz/`.
#
# The harness names "arithmetic on a length an attacker chose" as one of three
# classes it exists to find, and is documented to be run with `--release`
# because 32 million cases in a debug build is not a campaign. Release turns
# overflow checks off by default, so it was running in the one mode that cannot
# see that class: measured 2026-08-27 against an injected overflow on a field
# read straight out of the end of central directory record — 3,000 cases found
# 110 panics in debug and none in release. It costs 2.9% on a 200,000-case run.
[profile.release]
overflow-checks = true

[profile.dist]
inherits = "release"
lto = "thin"
