[package]
name = "slpc"
description = "Read, write, and validate slipcase containers: a ZIP holding a payload file and the TOML metadata that describes it"
homepage = "https://github.com/excelano/slipcase"
readme = "README.md"

# `testsupport` is a path dev-dependency, and `cargo package` strips a path
# dependency it cannot resolve from the packaged manifest. The test files that
# use it then reference a crate the manifest no longer declares, so
# `cargo test --all-features` inside the packaged tree fails to compile — which
# is what anybody vendoring or auditing this crate runs. Shipped that way in
# 0.3.5 and caught by RELEASING.md step 3 before 0.3.6.
#
# Excluded rather than inlined. The helper marks a file the way a platform's
# downloader marks one, and it is shared precisely because it was written twice
# and the two copies disagreed about the Windows arm within an hour; putting a
# third copy here to satisfy the packager would be undoing that on purpose. The
# test needs the workspace, so it stays in the workspace.
exclude = ["tests/provenance.rs"]
keywords = ["slipcase", "container", "metadata", "zip", "toml"]
categories = ["filesystem", "encoding"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Writing a container to a path, rather than into a writer the caller supplies.
# Off by default: a caller who only reads containers, or who writes into a
# socket or a buffer, should not acquire tempfile to do it, and the tree stays
# at fifteen crates for everyone who does not ask. Both binaries ask.
#
# Implies `provenance`, and that is a security property rather than
# convenience. `in_place` replaces a file by renaming a fresh one over it, and a
# fresh file carries no mark, so without the carry in `commit` every in-place
# rewrite strips whatever the platform recorded about where the original came
# from — measured on 2026-08-27, and it had been true since `in_place` existed.
# A caller who enables `fs` to replace containers would get that silently. It
# costs one crate on Unix, `xattr` itself, whose tree of `rustix`, `bitflags`
# and `linux-raw-sys` `tempfile` already brings in here; on Windows it costs
# nothing, an alternate data stream being reached through `std::fs`.
fs = ["dep:tempfile", "provenance"]
# Carrying what the platform records about where a container came from onto the
# payload taken out of it. Off by default, and separate from `fs` rather than
# part of it: a caller writing containers has no use for it, and a caller who
# only ever unpacks containers they made does not need it either. It adds
# `xattr` on Unix and nothing at all on Windows, where an alternate data stream
# is reached through `std::fs`. What that costs depends on what else is on, and
# counting only the good case would be the kind of claim this repository does
# not make: measured on 2026-08-26, one crate on top of `fs`, which already
# brings `xattr`'s own tree of `rustix`, `bitflags` and `linux-raw-sys` through
# `tempfile` — and four on its own, since `provenance` does not imply `fs` and a
# caller may well want it without one.
provenance = ["dep:xattr"]

[dependencies]
# Default features link libbz2 and libzstd through bzip2-sys and zstd-sys. The
# flate2 backend is named directly rather than through the `deflate` feature,
# which would also pull zopfli for a compression level nothing here asks for.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml_edit = "0.25"
# The `fs` feature alone. Its tree is pure Rust: libc and linux-raw-sys are
# declarations rather than a C library to compile.
tempfile = { version = "3.27", optional = true }

[package.metadata.docs.rs]
# docs.rs renders `fs` too, or the type is documented nowhere a reader looks.
all-features = true

[dev-dependencies]
# Marking a file the way a downloader does. One copy for both suites: the two
# they had disagreed about the Windows arm within an hour of being written.
testsupport = { path = "../testsupport" }
# Sandbox directories for the `fs` tests, which need a real filesystem to
# rename across. Not the same use as the optional dependency above.
tempfile = "3.27"
# Already in the tree under zip; the tests build archives by hand and need it
# to stamp their own headers.
crc32fast = "1.5"
# The suite builds one deflated fixture with an ordinary writer, because
# compressing by hand would test the test rather than the library.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Extended attributes, for the `provenance` feature. `default-features = false`
# keeps it to `rustix` rather than adding a `std::fs`-shaped convenience layer,
# and its tree is declarations rather than a C library to compile, which is the
# same ground DESIGN.md 3 admits `tempfile` on. Windows needs no dependency:
# an alternate data stream is addressed by appending `:name` to a path.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
xattr = { version = "1.6", default-features = false, optional = true }
